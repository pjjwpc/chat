# Casdoor SSO Configuration
# This file is used for Casdoor SSO integration
# For production, configure these values with your Casdoor instance

enabled: false
endpoint: "http://localhost:8000"
clientId: "your-client-id"
clientSecret: "your-client-secret"
syncSecret: "your-sync-secret"

# Caching and Observability
redisCache: true          # Enable Redis-based state caching for multi-instance support
enableMetrics: true       # Enable Casdoor metrics collection
enableTracing: false      # Enable distributed tracing (Jaeger integration)
